<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ConectaPlay</title>
<!--
  Plugin do ConectaPlay no Media Station X (Junior, 16/11/2026).
  Roda DENTRO da TV do cliente (iframe do MSX) e busca canais, filmes e séries direto no servidor da lista
  pela internet da casa (os servidores das listas bloqueiam a nuvem). Monta as telas no formato do MSX.
  Sem senha guardada aqui: os dados da lista vêm de tv.conectaplay.tv.br só para TV ativada (código + WhatsApp).
  Precisa ficar em http (as listas não têm https): publicado no GitHub Pages em http://plugin.conectaplay.tv.br
  Só JavaScript antigo (ES5): TVs Samsung/LG velhas não entendem o novo.
-->
<script type="text/javascript" src="//msx.benzac.de/js/tvx-plugin.min.js"></script>
<script type="text/javascript">
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) q[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); });
  var D = q.d || '', API = (q.b || 'https://tv.conectaplay.tv.br') + '/api/msx';
  var EU = location.href.split('#')[0];   // este plugin (para as ações request:interaction)
  var conta = null, contaEm = 0, cache = {};
  var BASE = (q.b || 'https://tv.conectaplay.tv.br');
  // Cores do ConectaPlay (mesmas da tela de Início)
  var COR = { live: '#c8233f', vod: '#1667d9', series: '#6a35c9', cats: '#14214a', item: '#14214a' };
  // Fundo azul com a logo no rodapé, sem a camada cinza, e MAC + senha no canto de cima
  function deco(o) {
    o.background = BASE + '/msx/fundo-limpo.jpg';
    o.transparent = 1;
    if (conta && conta.mac) o.extension = '{col:msx-white-soft}MAC{col} ' + conta.mac + '   {col:msx-white-soft}Senha{col} ' + (conta.codigo || '');
    return o;
  }
  function acaoBusca() {
    return 'content:request:interaction:' + API + '?r=buscar&d=' + D + '&q={INPUT}|search:2|pt|Buscar canais, filmes e séries|' + BASE + '/msx/fundo-limpo.jpg||Digite pelo menos 2 letras@http://msx.benzac.de/interaction/input.html';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[{}]/g, ''); }
  function get(url, cb, tempo) {
    var x = new XMLHttpRequest(), feito = false;
    var fim = function (e, v) { if (!feito) { feito = true; cb(e, v); } };
    try { x.open('GET', url, true); } catch (e) { return fim(e); }
    x.timeout = tempo || 20000;
    x.onload = function () {
      if (x.status < 200 || x.status >= 300) return fim(new Error('HTTP ' + x.status));
      try { fim(null, JSON.parse(x.responseText)); } catch (e) { fim(new Error('resposta inválida')); }
    };
    x.onerror = function () { fim(new Error('sem conexão')); };
    x.ontimeout = function () { fim(new Error('demorou demais')); };
    x.send();
  }
  // Dados da lista desta TV (host, usuário, senha) + favoritos: perguntados ao ConectaPlay (1 vez a cada 2 min)
  function minhaConta(cb, forcar) {
    if (conta && !forcar && Date.now() - contaEm < 120000) return cb(null, conta);
    get(API + '?r=cred&d=' + encodeURIComponent(D), function (e, r) {
      var d = r && r.response && r.response.data;
      if (e || !d || !d.host) return cb(e || new Error((r && r.response && r.response.message) || 'TV não ativada'));
      conta = d; contaEm = Date.now(); cb(null, d);
    });
  }
  function xt(acao, extra, cb) {
    minhaConta(function (e, c) {
      if (e) return cb(e);
      var u = c.host + '/player_api.php?username=' + encodeURIComponent(c.user) + '&password=' + encodeURIComponent(c.pass) + (acao ? '&action=' + acao : '');
      for (var k in (extra || {})) u += '&' + k + '=' + encodeURIComponent(extra[k]);
      var h = cache[u];
      if (h && Date.now() - h.t < 600000) return cb(null, h.v);
      get(u, function (e2, v) { if (!e2) cache[u] = { t: Date.now(), v: v }; cb(e2, v); }, 25000);
    });
  }
  function arr(v) { return Object.prototype.toString.call(v) === '[object Array]' ? v : []; }
  function urlVideo(c, t, id, ext) {
    var b = c.host + '/' + (t === 'live' ? 'live' : t === 'vod' ? 'movie' : 'series') + '/' + encodeURIComponent(c.user) + '/' + encodeURIComponent(c.pass) + '/' + id;
    return b + (t === 'live' ? '.m3u8' : '.' + (ext || 'mp4'));
  }
  function req(dataId) { return 'request:interaction:' + dataId + '@' + EU; }
  function ehFav(t, id) { return arr(conta && conta.favoritos).some(function (f) { return f.t === t && String(f.id) === String(id); }); }
  function opcoesFav(t, id, nome, img) {
    var fav = ehFav(t, id);
    return { headline: nome, items: [{ icon: fav ? 'star-border' : 'star', label: fav ? 'Tirar dos favoritos' : 'Adicionar aos favoritos',
      action: 'execute:' + API + '?r=fav&d=' + D, data: { t: t, id: String(id), n: String(nome || '').slice(0, 80), i: img || '' } }] };
  }
  // tipo: 'cats' (categorias), 'live' (canais: logo à esquerda), 'eps' (episódios), 'poster' (filmes/séries)
  function grade(headline, tipo, itens, hint, corCat) {
    var tpl = tipo === 'live' ? { type: 'default', layout: '0,0,4,1', color: COR.item, imageWidth: 1, imageFiller: 'fit', icon: 'msx-white-soft:live-tv' }
      : tipo === 'eps' ? { type: 'default', layout: '0,0,6,1', color: COR.item, imageWidth: 2, imageFiller: 'cover', icon: 'msx-white-soft:play-circle-outline' }
      : tipo === 'cats' ? { type: 'default', layout: '0,0,4,1', color: COR.cats }
      : { type: 'separate', layout: '0,0,2,3', color: COR.item, imageFiller: 'cover' };
    var o = { type: 'list', headline: headline, hint: hint || (itens.length + ' itens'), template: tpl, items: itens.slice(0, 1500),
    };
    if (tipo === 'poster') o.compress = true;
    return deco(o);
  }
  function vazio(titulo, texto) {
    return deco({ type: 'list', headline: titulo, template: { type: 'default', layout: '0,0,12,2', color: COR.item }, items: [{ icon: 'info-outline', title: titulo, titleFooter: texto, action: 'back' }] });
  }
  // Vistos (selo verde): guardados junto com os favoritos desta TV
  function visto(k, id) { return arr(conta && conta.favoritos).some(function (f) { return f.t === 'visto' && f.k === k && String(f.id) === String(id); }); }
  function serieVista(sid) { return arr(conta && conta.favoritos).some(function (f) { return f.t === 'visto' && f.k === 'ep' && String(f.sid) === String(sid); }); }
  function ver(t, id, ext, sid, n, i, sn, si) { return { action: 'execute:' + API + '?r=ver&d=' + D, data: { t: t, id: String(id), ext: ext || 'mp4', sid: sid ? String(sid) : '', n: n || '', i: i || '', sn: sn || '', si: si || '' } }; }
  function selo(o, sim, txt) { if (sim) { o.stamp = '{ico:check} ' + (txt || 'Visto'); o.stampColor = 'msx-green'; } return o; }
  function itemDe(c, t, s) {
    var nome = esc(s.name);
    if (t === 'live') { var vl = ver('live', s.stream_id, null, null, nome, s.stream_icon);
      return { title: nome, image: s.stream_icon || null, action: vl.action, data: vl.data, options: opcoesFav('live', s.stream_id, nome, s.stream_icon) }; }
    if (t === 'vod') { var v = ver('vod', s.stream_id, s.container_extension, null, nome, s.stream_icon);
      return selo({ title: nome, image: s.stream_icon || null, titleFooter: s.rating ? '★ ' + s.rating : '',
        action: v.action, data: v.data, options: opcoesFav('vod', s.stream_id, nome, s.stream_icon) }, visto('vod', s.stream_id)); }
    return selo({ title: nome, image: s.cover || null, titleFooter: s.rating ? '★ ' + s.rating : '',
      action: 'content:' + req('serie:' + s.series_id), options: opcoesFav('series', s.series_id, nome, s.cover) }, serieVista(s.series_id), 'Assistindo');
  }
  var NOME = { live: 'TV ao Vivo', vod: 'Filmes', series: 'Séries' };
  var ACAO_CATS = { live: 'get_live_categories', vod: 'get_vod_categories', series: 'get_series_categories' };
  var ACAO_LISTA = { live: 'get_live_streams', vod: 'get_vod_streams', series: 'get_series' };

  function categorias(t, cb) {
    xt(ACAO_CATS[t], null, function (e, v) {
      if (e) return cb(e);
      var itens = arr(v).map(function (k) { return { title: esc(k.category_name), color: COR.cats, action: 'content:' + req('lista:' + t + ':' + k.category_id) }; });
      itens.unshift({ title: 'Todos', titleFooter: 'Tudo de ' + NOME[t], color: COR[t], action: 'content:' + req('lista:' + t + ':') });
      cb(null, grade(NOME[t], 'cats', itens, arr(v).length + ' categorias'));
    });
  }
  // Categorias num menu do lado: ao descer, os canais/filmes da categoria aparecem à direita (pedido do Paulo)
  var ICO = { live: 'live-tv', vod: 'movie', series: 'video-library' };
  function curto(nome, t) {   // "Filmes | Ação" vira "Ação"
    var n = esc(nome).replace(/^\s*(canais|filmes|s[ée]ries|tv)\s*[|:\-–]\s*/i, '');
    return n || esc(nome);
  }
  function menuCats(t, cb) {
    xt(ACAO_CATS[t], null, function (e, v) {
      if (e) return cb(e);
      var menu = [
        { icon: 'play-circle-outline', label: 'Voltar ao vídeo', action: 'player:show' },
        { icon: 'history', label: 'Vistos por último', data: req('recentes:' + t) },
        { icon: 'search', label: 'Buscar', action: acaoBusca() },
        { type: 'separator' },
        { icon: ICO[t], label: 'Todos', data: req('lista:' + t + ':') }
      ];
      arr(v).forEach(function (k) { menu.push({ icon: 'chevron-right', label: curto(k.category_name, t), data: req('lista:' + t + ':' + k.category_id) }); });
      var o = { name: 'ConectaPlay', headline: NOME[t], logo: BASE + '/msx/logo-' + t + '.png', logoSize: 'large', style: 'flat-separator', menu: menu };
      deco(o);
      cb(null, o);
    });
  }
  // Monta a grade em páginas que cabem do lado direito, ao lado do menu de categorias (como no app ConectaPlay).
  // Modo compacto do MSX = grade 16x8; com o menu aberto cabem 8 colunas.
  function paginas(headline, tipo, itens, hint, larg) {
    larg = larg || 8;
    var max = itens.slice(0, 200), lista = [], i = 0;
    var porLinha, linhas, w, h;
    if (tipo === 'poster') { w = 2; h = 4; porLinha = 8; linhas = 2; }
    else { w = 8; h = 1; porLinha = 2; linhas = 8; }
    var sobra = 16 - porLinha * w;   // espaço vazio no fim de cada linha: o conteúdo fica só ao lado do menu
    max.forEach(function (it, n) {
        var o = {}; for (var k in it) o[k] = it[k];
        o.layout = '0,0,' + w + ',' + h;
        if (!o.color) o.color = COR.item;
        if (tipo === 'poster') { o.type = 'separate'; o.imageFiller = 'cover'; }
        else { o.type = 'default'; o.imageWidth = tipo === 'eps' ? 2 : 1; o.imageFiller = tipo === 'eps' ? 'cover' : 'fit'; }
        lista.push(o);
    });
    if (!lista.length) return vazio(headline, 'Nada por aqui.');
    return deco({ type: 'list', headline: headline, hint: hint || (itens.length + ' itens'), compress: true,
      template: { type: tipo === 'poster' ? 'separate' : 'default', layout: '0,0,' + w + ',' + h, color: COR.item }, items: lista });
  }
  // Canais em H265/HEVC: a TV pelo Media Station X toca só o áudio. Esconde (fica a versão FHD/HD do mesmo canal).
  function semH265(v) { return arr(v).filter(function (s) { return !/h\.?265|hevc/i.test(String(s.name || '')); }); }
  // "Vistos por último": canais, filmes e séries que esta TV abriu (o mais recente primeiro)
  function recentes(t, cb) {
    minhaConta(function (e, c) {
      if (e) return cb(e);
      var vs = arr(c.favoritos).filter(function (f) { return f.t === 'visto'; }), itens = [], jaSerie = {};
      vs.forEach(function (f) {
        if (t === 'live' && f.k === 'live') {
          var v = ver('live', f.id, null, null, f.n, f.i);
          itens.push({ title: esc(f.n || 'Canal'), image: f.i || null, action: v.action, data: v.data, options: opcoesFav('live', f.id, f.n, f.i) });
        } else if (t === 'vod' && f.k === 'vod') {
          var v2 = ver('vod', f.id, f.ext, null, f.n, f.i);
          itens.push(selo({ title: esc(f.n || 'Filme'), image: f.i || null, action: v2.action, data: v2.data, options: opcoesFav('vod', f.id, f.n, f.i) }, true));
        } else if (t === 'series' && f.k === 'ep' && f.sid && !jaSerie[f.sid]) {
          jaSerie[f.sid] = 1;
          itens.push(selo({ title: esc(f.sn || 'Série'), image: f.si || null, action: 'content:' + req('serie:' + f.sid),
            options: opcoesFav('series', f.sid, f.sn, f.si) }, true, 'Assistindo'));
        }
      });
      if (!itens.length) return cb(null, vazio('Vistos por último', 'Ainda não tem nada aqui. O que você assistir nesta TV aparece nesta lista.'));
      cb(null, paginas('Vistos por último', t === 'live' ? 'live' : 'poster', itens, itens.length + ' itens', 8));
    }, true);
  }
  function lista(t, cat, cb) {
    xt(ACAO_LISTA[t], cat ? { category_id: cat } : null, function (e, v) {
      if (e) return cb(e);
      minhaConta(function (e2, c) { cb(e2, e2 ? null : paginas(NOME[t], t === 'live' ? 'live' : 'poster', (t === 'live' ? semH265(v) : arr(v)).map(function (s) { return itemDe(c, t, s); }), null, 8)); });
    });
  }
  function serie(sid, cb) {
    xt('get_series_info', { series_id: sid }, function (e, info) {
      if (e) return cb(e);
      minhaConta(function (e2, c) {
        if (e2) return cb(e2);
        info = info || {}; var eps = info.episodes || {}, itens = [];
        Object.keys(eps).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (temp) {
          arr(eps[temp]).forEach(function (ep) {
            var v = ver('ep', ep.id, ep.container_extension, sid, 'T' + temp + ' E' + ep.episode_num, null, (info.info && info.info.name) || '', (info.info && info.info.cover) || '');
            itens.push(selo({ title: 'T' + temp + ' E' + ep.episode_num, titleFooter: esc(ep.title || ''),
              image: (ep.info && ep.info.movie_image) || (info.info && info.info.cover) || null,
              action: v.action, data: v.data }, visto('ep', ep.id)));
          });
        });
        cb(null, paginas(esc((info.info && info.info.name) || 'Série'), 'eps', itens, itens.length + ' episódios', 8));
      });
    });
  }
  function favoritos(cb) {
    minhaConta(function (e, c) {
      if (e) return cb(e);
      var itens = arr(c.favoritos).filter(function (f) { return f.t !== 'visto'; }).map(function (f) {
        var it = { title: esc(f.n), image: f.i || null, options: opcoesFav(f.t, f.id, f.n, f.i) };
        if (f.t === 'series') it.action = 'content:' + req('serie:' + f.id);
        else { var v = ver(f.t, f.id, f.t === 'vod' ? 'mp4' : null, null, f.n, f.i); it.action = v.action; it.data = v.data; }   // canal favorito também no player com antitravamento
        return it;
      });
      if (!itens.length) return cb(null, vazio('Favoritos', 'Ainda não tem favoritos. Em qualquer canal, filme ou série aperte o botão {col:msx-yellow}MENU{col} (ou segure OK) e escolha "Adicionar aos favoritos".'));
      cb(null, paginas('Favoritos', 'poster', itens, null, 16));
    }, true);
  }
  function buscar(termo, cb) {
    var t = String(termo || '').toLowerCase().replace(/^\s+|\s+$/g, '');
    if (t.length < 2) return cb(null, vazio('Buscar', 'Digite pelo menos 2 letras.'));
    var res = {}, falta = 3;
    ['live', 'vod', 'series'].forEach(function (k) {
      xt(ACAO_LISTA[k], null, function (e, v) { res[k] = e ? [] : (k === 'live' ? semH265(v) : arr(v)); if (--falta === 0) pronto(); });
    });
    function pronto() {
      minhaConta(function (e, c) {
        if (e) return cb(e);
        var casa = function (s) { return String(s.name || '').toLowerCase().indexOf(t) >= 0; };
        var itens = [], rot = { live: 'Canal', vod: 'Filme', series: 'Série' };
        ['live', 'vod', 'series'].forEach(function (k) {
          res[k].filter(casa).slice(0, 60).forEach(function (s) { var it = itemDe(c, k, s); it.titleHeader = rot[k]; itens.push(it); });
        });
        if (!itens.length) return cb(null, vazio('Nada encontrado', 'Não achamos "' + esc(termo) + '". Tente outra palavra.'));
        cb(null, paginas('Buscar: "' + esc(termo) + '"', 'poster', itens, itens.length + ' encontrados', 16));
      });
    }
  }

  function Handler() {
    this.init = function () { };
    this.ready = function () { minhaConta(function () { }); };
    this.handleEvent = function () { };
    this.handleData = function () { };
    this.handleRequest = function (dataId, data, callback) {
      var p = String(dataId || '').split(':');
      var tentou = false, self = this;
      var fim = function (e, v) {
        if (e && !tentou) { tentou = true; conta = null; return setTimeout(function () { executar(); }, 800); }
        if (e) return callback(vazio('Não deu agora', 'Não conseguimos carregar (' + esc(e.message) + '). Confira a internet da TV e tente de novo. Se continuar, fale no WhatsApp (48) 99212-7260.'));
        callback(v);
      };
      function executar() { try {
        if (p[0] === 'cats') return categorias(p[1], fim);
        if (p[0] === 'menu') return menuCats(p[1], fim);
        if (p[0] === 'recentes') return recentes(p[1], fim);
        if (p[0] === 'lista') return lista(p[1], p.slice(2).join(':'), fim);
        if (p[0] === 'serie') return serie(p.slice(1).join(':'), fim);
        if (p[0] === 'favs') return favoritos(fim);
        if (p[0] === 'buscar') return buscar(decodeURIComponent(p.slice(1).join(':')), fim);
        fim(new Error('tela desconhecida'));
      } catch (e) { fim(e); } }
      executar();
    };
  }
  var H = new Handler();
  window.cpTeste = function (id, cb) { H.handleRequest(id, null, cb || function (v) { console.log(JSON.stringify(v).slice(0, 2000)); }); };   // teste pelo navegador
  TVXPluginTools.onReady(function () {
    TVXInteractionPlugin.setupHandler(H);
    TVXInteractionPlugin.init();
  });
})();
</script>
</head>
